name = "persian-gif-bot"
main = "src/index.ts"
compatibility_date = "2024-09-20"
compatibility_flags = ["nodejs_compat"]

[vars]
# Configuration variables (sensitive tokens should be set using `wrangler secret put`)
STORAGE_CHANNEL_ID = "-1004401697854"
DAILY_SUBMISSION_CAP = "5"
MAX_MEDIA_SIZE_BYTES = "10485760"
MAX_MEDIA_DURATION_SEC = "30"

[[d1_databases]]
binding = "DB"
database_name = "persian-gif-db"
database_id = "12665dc8-573c-4200-b4d1-94c696d8c036"
